[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "citrus-data-audit"
version = "3.2.1"
description = "Coordinate-preserving data quality and numeric relationship checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1.5,<4",
    "python-calamine>=0.5.4,<0.6",
    "pdfplumber>=0.11.7,<0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
data-audit = "citrus_audit.cli:main"

[tool.setuptools.packages.find]
include = ["citrus_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
